name: Verify thesis template
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install XeLaTeX, Biber, Carlito and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-xetex texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended texlive-lang-other fonts-crosextra-carlito poppler-utils
      - name: Test, compile and audit the public sample
        run: make check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: skripsi-preview
          path: build/skripsi-preview.pdf
          if-no-files-found: error
